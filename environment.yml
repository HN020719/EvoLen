# EvoLen environment.
#
# Versions below are those of the environment used to produce the results in the
# paper. Recreate with:
#
#   conda env create -f environment.yml
#   conda activate evolen
#
# Note: torch is pinned to the CUDA 12.8 build published on PyPI. If your driver
# needs a different CUDA version, install torch separately following the
# instructions at https://pytorch.org and drop it from the pip list below.
name: evolen
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  - python=3.9
  # command-line tools invoked by the tokenizer and analysis scripts
  - bedtools=2.27.1
  - samtools=1.3.1
  - bcftools=1.3.1
  # scientific stack installed from conda in the reference environment
  - biopython=1.85
  # The reference environment had pysam 0.9.1, which links against OpenSSL 1.1
  # and fails to import on a fresh solve. 0.22.1 is pinned here instead and has
  # been verified; only pysam.FastaFile is used, whose API is unchanged.
  - pysam=0.22.1
  - scikit-learn=1.6.1
  - matplotlib=3.9.2
  - seaborn=0.13.2
  - pandas=2.3.3
  - scipy=1.13.1
  - pip
  - pip:
      # modelling
      - torch==2.8.0
      - transformers==4.35.2
      - tokenizers==0.15.2
      - datasets==4.4.1
      - accelerate==0.25.0
      - evaluate==0.4.6
      - huggingface-hub==0.34.4
      - safetensors==0.7.0
      - numpy==2.0.2
      # genomics I/O
      - pyBigWig==0.3.25
      # experiment tracking (optional; scripts run without a W&B account)
      - wandb==0.23.1
      # Optional. Only needed for the LoRA branches in train_scripts/*_train.py,
      # which are disabled by default and were not used for the reported results.
      # - peft
